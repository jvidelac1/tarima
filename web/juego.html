<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03050c">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>Tarima · Halterofilia a un botón</title>
<link rel="icon" href="iconos/icono-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<meta name="apple-mobile-web-app-title" content="Tarima">
<link rel="stylesheet" href="css/juego.css">
<link rel="stylesheet" href="css/bienvenida.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<noscript><p style="padding:2em;font:16px/1.5 system-ui,sans-serif;color:#f2f4ff">Tarima necesita JavaScript activado. · Tarima needs JavaScript turned on.</p></noscript>
<div id="app">
<div id="escena">
  <canvas id="gl" aria-label="Transmisión 3D del levantamiento"></canvas>
  <canvas id="ayudas" aria-hidden="true"></canvas>
  <div id="tv">
    <div class="bug"><b id="ev-titulo">Final Tarima · Pretemporada</b><span id="ev-sub">Categoría hasta 90 kg</span></div>
    <div class="relojbox"><div class="luces" id="luces" aria-label="Decisión de los jueces"><i></i><i></i><i></i></div><div class="reloj" id="reloj">0:30</div></div>
    <div class="etiqueta" id="etiqueta" hidden></div>
    <div class="cartel" id="cartel" hidden></div>
    <div class="margen" id="margen" hidden aria-hidden="true"></div>
    <div class="veredicto" id="veredicto" hidden></div>
    <div class="senal" id="senal" hidden aria-live="off"></div>
    <div class="guia" id="guia" hidden></div>
    <div class="rival" id="rival" hidden></div>
    <div class="turno" id="turno" hidden aria-live="polite"></div>
    <div class="marcador" id="marcador" hidden aria-live="polite"></div>
    <div class="acuse" id="acuse" hidden aria-hidden="true"><kbd class="tecla"></kbd><b></b></div>
    <pre class="depura" id="depura" hidden></pre>
    <div class="zocalo" id="zocalo" hidden>
      <div class="bandera" id="z-bandera"></div>
      <div class="quien"><div class="l1"><span id="z-codigo"></span><span id="z-dorsal"></span></div><div class="nombre" id="z-nombre"></div></div>
      <div class="lev"><div id="z-lev"></div><div id="z-intento"></div></div>
      <div class="kg"><b id="z-kg">0</b><span>kg</span></div>
    </div>
  </div>
  <div id="capa"></div>
  <button id="pausa" hidden aria-label="Pausa" title="Pausa (Esc)">II</button>
  <button id="sonidob" type="button" hidden aria-label="Sonido" aria-pressed="true"></button>
  <button id="saltar" hidden tabindex="-1">Saltar práctica <kbd class="tecla ch">ESC</kbd></button>
  <div id="sobre" hidden></div>
  <div id="sinfoco" hidden>El juego no recibe el teclado · haz clic aquí</div>
  <div id="msg">Tarima</div>
</div>
<div id="zona" aria-label="Zona de toque del levantamiento"><span id="zona-txt">Toca</span></div>
<div id="instalar" hidden role="status"><span id="instalar-t"></span><button id="instalar-ok" type="button">OK</button></div>
</div>
<div id="editor" hidden><label for="editor-campo"><span id="editor-t"></span></label><div class="fila"><input id="editor-campo" autocomplete="off"><button class="ir" id="editor-listo" type="button">Listo</button></div></div>
<script type="module" src="js/game/telefono.js"></script>
<script type="module" src="js/game/main.js"></script>
</body>
</html>

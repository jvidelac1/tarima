<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tarima · Halterofilia</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl" aria-label="Transmisión 3D del levantamiento"></canvas>

  <!-- gráfica de TV -->
  <div class="gfx" id="gfx">
    <div class="bug">
      <svg viewBox="0 0 48 20" aria-hidden="true"><rect x="2" y="9" width="44" height="2"/><rect x="7" y="2" width="4" height="16"/><rect x="13" y="5" width="3" height="10"/><rect x="37" y="2" width="4" height="16"/><rect x="32" y="5" width="3" height="10"/></svg>
      <div><b id="ev-title">TARIMA OPEN</b><span id="ev-sub">Final A · 2026</span></div>
      <i class="live" id="live">EN VIVO</i>
    </div>
    <div class="clockbox">
      <div class="lamps" id="lamps" aria-label="Decisión de los árbitros"><i></i><i></i><i></i></div>
      <div class="clock" id="clock">1:00</div>
    </div>
    <div class="replay" id="replay" hidden>Repetición · cámara lenta</div>
    <div class="verdict" id="verdict" hidden>Levantamiento válido</div>

    <div class="telemetry" id="telemetry">
      <div class="phase-label">Fase</div>
      <div id="phase">Parado</div>
      <div class="ticks" id="ticks"></div>
      <div id="nums"></div>
    </div>

    <div class="lower" id="lower">
      <div class="flag" id="flag"></div>
      <div class="who">
        <div class="l1"><span class="code" id="code">ARX</span><span id="cat">81 kg</span><span id="bio"></span></div>
        <div class="name" id="name">&nbsp;</div>
      </div>
      <div class="lift">
        <div class="l1" id="liftname">Dos tiempos</div>
        <div class="att" id="attempt">Intento 1</div>
      </div>
      <div class="kg"><b id="kg">0</b><span>kg</span></div>
    </div>
  </div>

  <div class="cams" id="cams" role="group" aria-label="Cámaras"></div>
  <div id="msg">Cargando…</div>
</div>

<div class="panel" id="panel">
  <div class="row">
    <div class="grp" id="who" role="group" aria-label="Atleta"></div>
    <div class="grp" role="group" aria-label="Levantamiento">
      <button class="chip" id="lift-c" aria-pressed="true">Dos tiempos</button>
      <button class="chip" id="lift-s" aria-pressed="false">Arranque</button>
    </div>
    <div class="grp main">
      <button class="chip" id="more-btn" aria-expanded="false" aria-controls="more">Más</button>
      <button class="chip go" id="play">Reproducir</button>
    </div>
    <div class="more" id="more">
      <div class="grp" id="jrow" role="group" aria-label="Envión">
        <button class="chip" id="jk-split" aria-pressed="true">Tijera</button>
        <button class="chip" id="jk-power" aria-pressed="false">Power</button>
        <button class="chip" id="jk-squat" aria-pressed="false">Squat</button>
      </div>
      <label class="kgin">Carga <input type="number" id="load" min="25" max="280" step="1" value="100" inputmode="numeric" aria-label="Carga total en kilos"> kg</label>
      <div class="grp" role="group" aria-label="Opciones">
        <button class="chip" id="trace" aria-pressed="false">Traza</button>
        <button class="chip" id="slow" aria-pressed="false">Lento</button>
        <select class="chip" id="quality" aria-label="Calidad"><option value="auto">Calidad: auto</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
        <select class="chip" id="shot" aria-label="Plano de cámara"><option value="">Plano: general</option></select>
      </div>
      <div class="grp">
        <button class="chip" id="replay-btn">Repetición</button>
      </div>
    </div>
  </div>
  <input type="range" id="scrub" min="0" max="12" step="0.01" value="0" aria-label="Fase del levantamiento">
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

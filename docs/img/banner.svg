<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="LIFTING GAME — one button, three lifters, one bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0a1130"/>
      <stop offset="1" stop-color="#03050c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.72" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#3ee6c8" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#2a5bff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a21b"/>
    </linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#c23a2c"/>
      <rect width="4" height="10" fill="#e2503f"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#spot)"/>

  <!-- stage boards -->
  <g opacity="0.18" stroke="#9fb4ff" stroke-width="1">
    <line x1="0" y1="350" x2="1280" y2="350"/>
    <line x1="0" y1="372" x2="1280" y2="372"/>
    <line x1="0" y1="396" x2="1280" y2="396"/>
  </g>

  <!-- barbell -->
  <g transform="translate(760 92)">
    <rect x="-40" y="76" width="560" height="10" rx="5" fill="#c9d2e3"/>
    <rect x="40" y="10" width="34" height="142" rx="6" fill="#d63a2e"/>
    <rect x="78" y="22" width="26" height="118" rx="5" fill="#2bb673"/>
    <rect x="108" y="38" width="16" height="86" rx="4" fill="#f2c12e"/>
    <rect x="396" y="38" width="16" height="86" rx="4" fill="#f2c12e"/>
    <rect x="416" y="22" width="26" height="118" rx="5" fill="#2bb673"/>
    <rect x="446" y="10" width="34" height="142" rx="6" fill="#d63a2e"/>
    <rect x="-46" y="70" width="14" height="22" rx="3" fill="#e9eef7"/>
    <rect x="512" y="70" width="14" height="22" rx="3" fill="#e9eef7"/>
  </g>

  <!-- title -->
  <text x="64" y="150" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="2" fill="#ffffff">LIFTING</text>
  <text x="64" y="244" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="2" fill="url(#gold)">GAME</text>
  <text x="68" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#cfd8ff">One button. Three lifters. One bar that only goes up.</text>

  <!-- timing bar -->
  <g transform="translate(64 318)">
    <rect x="0" y="0" width="620" height="30" rx="8" fill="url(#hatch)"/>
    <rect x="90" y="0" width="440" height="30" fill="#f2c12e"/>
    <rect x="210" y="0" width="200" height="30" fill="#22c55e"/>
    <rect x="0" y="0" width="620" height="30" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="300" y="-8" width="8" height="46" rx="3" fill="#ffffff"/>
    <path d="M296 -16 L312 -16 L304 -6 Z" fill="#ffffff"/>
    <text x="640" y="22" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="22" letter-spacing="1" fill="#22c55e">PERFECT!</text>
  </g>
</svg>

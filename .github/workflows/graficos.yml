# Gráficos fase 1 (rama graficos): fotos de cada calidad con las cámaras del juego y la vista del jurado, y el banco de
# medición con el ambiente nuevo. El runner dibuja por software (SwiftShader): las fotos sirven para mirar el aspecto y que
# los sombreadores compilen; LOS TIEMPOS NO DICEN NADA de una placa real (eso se mide con juego.html?banco=1 en una máquina
# con placa). A pedido y en cada push a la rama que toque el dibujo.
name: Gráficos (fotos por calidad y banco, por software)

on:
  push:
    branches: [graficos, graficos2, look, plantel, visual, pov]
    paths:
      - 'web/js/**'
      - 'tools/banco.mjs'
      - 'tools/check_pov.mjs'
      - 'tools/check_barra.mjs'
      - '.github/workflows/graficos.yml'
  workflow_dispatch:
    inputs:
      banco:
        description: 'Correr también el banco de medición (10 min más)'
        type: boolean
        default: false
      comparar:
        description: 'Comparar el costo de «Baja» y «Móvil» contra la rama base en la misma máquina (A, B, A, B)'
        type: boolean
        default: false
      niveles:
        description: 'Calidades de las fotos (vacío: todas). Ej.: alta,movil'
        type: string
        default: ''
      con_alta:
        description: 'La comparación mide también «Alta» (tarda el doble)'
        type: boolean
        default: false
      base:
        description: 'Rama base de la comparación'
        type: string
        default: main
      pesistas_run:
        description: 'Corrida de pesistas.yml de la que tomar los modelos del plantel (vacío: la de PESISTAS_RUN)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  # corrida de pesistas.yml con los modelos del plantel que se fotografían (no están en el repo mientras se iteran)
  PESISTAS_RUN: '43875357534'
  # plaza del juego y terna que se fotografía: el pesista en escena es el primero de la terna (plaza ventura)
  TERNA: 'ilarraz,jastrev,solanet'

defaults:
  run:
    shell: bash

jobs:
  fotos:
    name: Fotos por calidad (dibujo por software)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARIMA_ANGLE: swiftshader
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            wget -q -O "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -q && sudo apt-get install -y -q "$RUNNER_TEMP/chrome.deb"
            CHROME="$(command -v google-chrome)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p out/logs out/graficos
      - name: Modelos del plantel desde una corrida de pesistas.yml (sin subirlos al repo)
        if: ${{ inputs.pesistas_run || env.PESISTAS_RUN }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.pesistas_run || env.PESISTAS_RUN }}
        run: |
          for r in $RUN; do gh run download "$r" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/pes_$r" || true; python3 tools/sumar_pesista.py "$RUNNER_TEMP/pes_$r" || true; rm -rf "$RUNNER_TEMP/pes_$r"; done
          python3 tools/plantel_web.py; ls -la web/models
      - name: Lógica de fluidez sin navegador (perf_test)
        run: node tools/perf_test.mjs 2>&1 | tee out/logs/perf_test.log
      - name: Fotos de cada calidad (banco --fotos --niveles)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: node tools/banco.mjs --fotos=out/graficos/fotos --niveles${{ inputs.niveles && format('={0}', inputs.niveles) || (github.event_name == 'push' && '=alta,movil' || '') }} --ancho=1280 --alto=620 2>&1 | tee out/logs/fotos.log
      - name: Fotos del laboratorio de materiales (banco --fotos --lab)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node tools/banco.mjs --fotos=out/graficos/lab --lab=materiales --ancho=1280 --alto=620 2>&1 | tee out/logs/lab.log
      - name: Fotos del plantel (el primero de la terna en todas las tomas; los otros en plano medio, torso y cara)
        if: ${{ !cancelled() && hashFiles('web/models/ilarraz.glb') != '' }}
        timeout-minutes: 30
        run: |
          node tools/banco.mjs --fotos=out/graficos/plantel/a --niveles=alta,movil --plantel=$TERNA --pesista=ventura --ancho=1280 --alto=620 2>&1 | tee out/logs/fotos_plantel.log || true
          for plaza in brenner marangi; do
            node tools/banco.mjs --fotos=out/graficos/plantel/$plaza --niveles=alta --tomas=medio,torso,cara,3-4,medio-salida --plantel=$TERNA --pesista=$plaza --ancho=1280 --alto=620 2>&1 | tee -a out/logs/fotos_plantel.log || true
          done
      - name: Banco de medición con el ambiente (banco)
        if: ${{ !cancelled() && inputs.banco }}
        timeout-minutes: 20
        run: node tools/banco.mjs --ancho=960 --alto=540 --limite=420 --json=out/graficos/banco.json 2>&1 | tee out/logs/banco.log
      - name: Resultado como artefacto
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: graficos-out
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # Primera persona y final del levantamiento (rama pov): hojas de fotos cuadro a cuadro del final de un válido, un nulo y
  # una caída, con medidas (pies que resbalan, giros, manos contra el tronco); la primera persona a lo largo de cada
  # levantamiento; y tres arranques jugados de verdad (barrita) con la cámara general y en primera persona, con 32 fotos del
  # final de cada uno.
  pov:
    name: Primera persona y final del levantamiento (dibujo por software)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARIMA_ANGLE: swiftshader
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            wget -q -O "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -q && sudo apt-get install -y -q "$RUNNER_TEMP/chrome.deb"
            CHROME="$(command -v google-chrome)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p out/logs
      - name: Final cuadro a cuadro y primera persona (check_pov)
        timeout-minutes: 25
        run: node tools/check_pov.mjs 2>&1 | tee out/logs/check_pov.log
      - name: Tres arranques jugados en primera persona, con el final denso (check_barra --camara=pov --final)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          TAPA_INFORMA: 1
        run: |
          node tools/check_barra.mjs --solo=pc_es --camara=pov --final --out=out/barra_pov 2>&1 | tee out/logs/check_barra_pov.log
          node tools/hojas.mjs out/barra_pov --cols=6 --ancho=400
      - name: Tres arranques jugados con la cámara general, con el final denso (check_barra --final)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          TAPA_INFORMA: 1
        run: |
          node tools/check_barra.mjs --solo=pc_es --final --out=out/barra_general 2>&1 | tee out/logs/check_barra_general.log
          node tools/hojas.mjs out/barra_general --cols=6 --ancho=400
      - name: Resultado como artefacto
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pov-out
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # El mismo banco con el juego de main y con el de esta rama, alternados en la MISMA máquina (los runners cambian de una
  # corrida a otra hasta al doble: comparar dos corridas distintas no dice nada). Por software: vale la relación, no los ms.
  comparar:
    name: Costo contra la rama base en la misma máquina (por software)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.comparar }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARIMA_ANGLE: swiftshader
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base || 'main' }}
          path: base
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            wget -q -O "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -q && sudo apt-get install -y -q "$RUNNER_TEMP/chrome.deb"
            CHROME="$(command -v google-chrome)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p out/logs out/comparar
      - name: Banco alternado (main, rama, main, rama, main, rama)
        run: |
          # la variante «ambiente» existe desde la rama graficos; en main se usa «sombras» (solo para que el banco tenga una)
          VAR_BASE=sombras; grep -q "ambiente" base/tools/banco.mjs base/web/js/game/banco.js 2>/dev/null && VAR_BASE=ambiente
          for k in 1 2 3; do
            node base/tools/banco.mjs --ancho=960 --alto=540 --limite=${{ inputs.con_alta && 230 || 110 }} --solo=${{ inputs.con_alta && 'baja,movil,alta' || 'baja,movil' }} --variantes=pesista --vueltas=3 --json=out/comparar/main_$k.json > out/logs/comparar_main_$k.log 2>&1 || true
            node tools/banco.mjs --ancho=960 --alto=540 --limite=${{ inputs.con_alta && 230 || 110 }} --solo=${{ inputs.con_alta && 'baja,movil,alta' || 'baja,movil' }} --variantes=utileria,pesista --vueltas=3 --json=out/comparar/rama_$k.json > out/logs/comparar_rama_$k.log 2>&1 || true
          done
          node -e '
            const fs = require("fs");
            for (const f of fs.readdirSync("out/comparar").filter(f => f.endsWith(".json")).sort()) { const B = JSON.parse(fs.readFileSync("out/comparar/" + f));
              console.log(f, B.calidades.map(c => `${c.nombre}: ${c.ms1MP} ms a 1 MP (fijo ${c.fijoMs} + ${c.porMPms}/MP, ${c.vueltas} vueltas, ${c.ms1MPmin}-${c.ms1MPmax})`).join(" · "), "·", B.variantes.map(v => JSON.stringify(v).slice(0, 260)).join(" · ")); }
          ' | tee out/logs/comparar.txt
      - name: Resultado como artefacto
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: comparar-out
          path: out/
          if-no-files-found: warn
          retention-days: 14

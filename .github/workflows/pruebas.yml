# Pruebas del juego en cada push a `demo` y a `gameplay` (y a pedido). El runner no tiene placa: Chrome dibuja con SwiftShader (por
# software), así que acá se verifica lógica, toques, paneles y tutorial. Los cuadros por segundo NO se miden en este flujo:
# eso se mide en una máquina con placa (`juego.html?banco=1`, o `node tools/check_fluidez.mjs` con GPU).
# Cómo se dispara y cómo se leen los resultados: README, sección «Pruebas en GitHub Actions».
name: Pruebas del juego

on:
  push:
    branches: [demo, gameplay, tablero]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pruebas:
    # Cuatro máquinas en paralelo (antes una sola en fila: ~47 min). Cada grupo dura menos de ~15 min.
    name: ${{ matrix.titulo }} (dibujo por software)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { grupo: nucleo, titulo: 'Núcleo, emoción y partida completa' }
          - { grupo: toques, titulo: 'Toques, tutorial y capturas' }
          - { grupo: telefono, titulo: 'Teléfono de costado y en vertical' }
          - { grupo: recorrido, titulo: 'iPhone y recorrido de un jugador nuevo' }
    env:
      TARIMA_ANGLE: swiftshader      # WebGL por software, pedido de forma explícita (tools/browser.mjs)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Dependencias (playwright-core; three y los modelos ya están en el repo)
        run: npm ci

      - name: Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            wget -q -O "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -q && sudo apt-get install -y -q "$RUNNER_TEMP/chrome.deb"
            CHROME="$(command -v google-chrome)"
          fi
          "$CHROME" --version
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p out/logs
          { echo "commit $GITHUB_SHA"; "$CHROME" --version; node --version; nproc; } > out/logs/entorno.txt

      # Cada prueba corre aunque haya fallado la anterior: un push da el estado de las cuatro.
      - name: Núcleo determinista (sim_test)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/sim_test.mjs 2>&1 | tee out/logs/sim_test.log

      - name: Jugador humano simulado (play_human, nivel 'u', metas A y B)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/play_human.mjs 2>&1 | tee out/logs/play_human.log

      - name: La barrita sin navegador (barra_bots, Gameplay 3)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/barra_bots.mjs 2>&1 | tee out/logs/barra_bots.log

      - name: Toques con el dedo, sin navegador (dedo_test, niveles 'b' y 'u')
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/dedo_test.mjs 2>&1 | tee out/logs/dedo_test.log

      - name: Espacio en la computadora, sin navegador (teclado_test, niveles 'b' y 'u')
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/teclado_test.mjs 2>&1 | tee out/logs/teclado_test.log

      - name: Ritmo de la final, sin navegador (ritmo_test)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/ritmo_test.mjs 2>&1 | tee out/logs/ritmo_test.log

      - name: Calibración del margen con los cuerpos de cada pesista (margen_cal, metas C y D)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/margen_cal.mjs 2>&1 | tee out/logs/margen_cal.log

      - name: Chance del panel contra el núcleo (chance_test, meta F)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/chance_test.mjs 2>&1 | tee out/logs/chance_test.log

      - name: Pesistas y decisiones en finales enteras (pesistas_test, metas D y E)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/pesistas_test.mjs 2>&1 | tee out/logs/pesistas_test.log

      - name: Rivales con su propia estrategia de kilos (rivales_test)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/rivales_test.mjs 2>&1 | tee out/logs/rivales_test.log

      - name: Fácil de círculos, línea de base para registros viejos (play_human --f, no bloquea)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        continue-on-error: true
        run: node tools/play_human.mjs --f --n=600 2>&1 | tee out/logs/play_human_f.log

      - name: Lógica de fluidez sin navegador (perf_test)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/perf_test.mjs 2>&1 | tee out/logs/perf_test.log

      - name: Caída de la barra sin navegador (caida_test)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        run: node tools/caida_test.mjs 2>&1 | tee out/logs/caida_test.log

      - name: Escenas de emoción (check_escenas)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        timeout-minutes: 20
        run: node tools/check_escenas.mjs 2>&1 | tee out/logs/check_escenas.log

      - name: Partida completa por teclado y por toques (check_game)
        if: ${{ !cancelled() && matrix.grupo == 'nucleo' }}
        timeout-minutes: 25
        run: node tools/check_game.mjs 2>&1 | tee out/logs/check_game.log

      - name: Toques y tutorial en tiempo real (check_fluidez, modo lógica)
        if: ${{ !cancelled() && matrix.grupo == 'toques' }}
        timeout-minutes: 20
        run: node tools/check_fluidez.mjs --tutorial --json=out/fluidez/fluidez.json 2>&1 | tee out/logs/check_fluidez.log

      # La barrita ('b') en el navegador: computadora en español e inglés, teléfono acostado 667x375 y 844x390; cada barrita
      # sale donde se tocó, entra en la pantalla sin tapar nada, y con el reloj verdadero se mide la diferencia entre lo que se
      # ve y lo que juzga el núcleo. Capturas en out/barra.
      - name: La barrita en el navegador (check_barra)
        if: ${{ !cancelled() && matrix.grupo == 'toques' }}
        timeout-minutes: 20
        run: node tools/check_barra.mjs 2>&1 | tee out/logs/check_barra.log

      # Entrada en tiempo real con teclado real: toque durante PREPÁRATE, al cambiar de señal, doble, largo, ráfagas en
      # ¡EMPUJA!, después de una pausa y en el turno de un rival. Cada pulsación anotada, resuelta, con motivo y acuse.
      - name: Toques en tiempo real (check_toques)
        if: ${{ !cancelled() && matrix.grupo == 'toques' }}
        timeout-minutes: 10
        run: node tools/check_toques.mjs 2>&1 | tee out/logs/check_toques.log

      # Teléfono emulado (táctil): de costado en dos tamaños y con mano izquierda, jugado solo con toques, con una captura y
      # una revisión de cada pantalla (nada cortado, nada tapado, nada debajo de la muesca), campos de texto, dos dedos a
      # la vez, y el aviso «Gira el teléfono» en vertical. Capturas en out/telefono.
      - name: Teléfono de costado y en vertical (check_telefono)
        if: ${{ !cancelled() && matrix.grupo == 'telefono' }}
        timeout-minutes: 25
        run: node tools/check_telefono.mjs 2>&1 | tee out/logs/check_telefono.log

      # iPhone acostado con el agente de usuario de Safari y de Chrome de iOS: sonido desde el primer toque y con el parlante,
      # Opciones y «Cómo se juega» desplazados con el dedo sin cortar botones, y el aviso de pantalla completa de cada
      # navegador. Capturas en out/iphone.
      - name: iPhone acostado (check_iphone)
        if: ${{ !cancelled() && matrix.grupo == 'recorrido' }}
        timeout-minutes: 15
        run: node tools/check_iphone.mjs 2>&1 | tee out/logs/check_iphone.log

      # Para mirar el juego sin abrir un navegador: una captura por panel, por señal y por toque, con un cuadro del 3D
      # dibujado por software antes de cada una. Las capturas atrasan los toques, así que este paso no decide el resultado.
      - name: Capturas con el 3D dibujado (no bloquea)
        if: ${{ !cancelled() && matrix.grupo == 'toques' }}
        continue-on-error: true
        timeout-minutes: 15
        run: node tools/check_fluidez.mjs --tutorial --capturas=out/capturas --json=out/capturas/fluidez.json 2>&1 | tee out/logs/capturas.log

      # Recorrido de un jugador nuevo que no saltea nada entre levantamientos (cuánto espera y en qué), un fallo machacando
      # Espacio, y capturas a 1745x845 de cada momento en out/recorrido. Falla si la espera sin rivales en el medio llega a
      # 6 s o si machacando no se ve el motivo del fallo al menos 1 s.
      - name: Recorrido de un jugador nuevo (check_recorrido)
        if: ${{ !cancelled() && matrix.grupo == 'recorrido' }}
        timeout-minutes: 20
        run: node tools/check_recorrido.mjs 2>&1 | tee out/logs/check_recorrido.log

      # El mismo recorrido saltando cada rival con el botón «Saltar» (tecla S) al segundo: con eso la final tiene que seguir
      # cumpliendo el ritmo (espera ≤ 20 s, final ≤ 150 s). Capturas en out/recorrido_salta.
      - name: Recorrido saltando los rivales (check_recorrido --salta)
        if: ${{ !cancelled() && matrix.grupo == 'recorrido' }}
        timeout-minutes: 20
        run: node tools/check_recorrido.mjs --salta 2>&1 | tee out/logs/check_recorrido_salta.log

      # El mismo recorrido en inglés (?lang=en), para mirar los textos: capturas en out/recorrido_en. No decide el resultado.
      - name: Recorrido en inglés (check_recorrido --lang=en, no bloquea)
        if: ${{ !cancelled() && matrix.grupo == 'recorrido' }}
        continue-on-error: true
        timeout-minutes: 20
        run: node tools/check_recorrido.mjs --lang=en 2>&1 | tee out/logs/check_recorrido_en.log

      - name: Resumen
        if: ${{ always() }}
        run: |
          {
            echo "### Pruebas del juego (dibujo por software: no mide cuadros por segundo)"
            echo "Grupo: ${{ matrix.titulo }}"
            for f in sim_test barra_bots play_human dedo_test perf_test caida_test check_escenas check_game check_barra check_toques check_telefono check_iphone check_fluidez capturas check_recorrido check_recorrido_salta check_recorrido_en; do
              [ -f "out/logs/$f.log" ] || continue
              echo; echo "**$f**"; echo '```'
              tail -n 14 "out/logs/$f.log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capturas, JSON y registros como artefacto
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pruebas-out-${{ matrix.grupo }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
